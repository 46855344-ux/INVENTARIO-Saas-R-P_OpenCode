# VirtualHost de referencia para servir el backend Laravel con Apache (XAMPP).
#
# Copiar el bloque <VirtualHost> en:
#   C:\xampp\apache\conf\extra\httpd-vhosts.conf
# y agregar en C:\Windows\System32\drivers\etc\hosts:
#   127.0.0.1  saas-inversiones-rp.local
#
# Ajustar la ruta según la ubicación real del repositorio.

<VirtualHost *:80>
    ServerName saas-inversiones-rp.local
    DocumentRoot "D:/Proyectos Open Code/Inventario_Saas_RYP/SAAS-INVERSIONES-RP/backend/public"

    <Directory "D:/Proyectos Open Code/Inventario_Saas_RYP/SAAS-INVERSIONES-RP/backend/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/saas-inversiones-rp-error.log"
    CustomLog "logs/saas-inversiones-rp-access.log" combined
</VirtualHost>
