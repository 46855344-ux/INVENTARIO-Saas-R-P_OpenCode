; Configuración PHP para el contenedor de desarrollo.
; Se monta en /usr/local/etc/php/conf.d/zz-saas.ini

date.timezone = UTC
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 24M
max_execution_time = 120

; Mostrar errores solo en desarrollo.
display_errors = On
error_reporting = E_ALL

; Logs a stderr para que `docker compose logs` los muestre.
log_errors = On
error_log = /dev/stderr

; Opcache para desarrollo (sin revalidación agresiva).
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
