name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --- Backend: Laravel ------------------------------------------------------
  backend:
    name: Backend (Laravel)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, json, openssl, intl, zip
          coverage: none

      - name: Cache de Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verificar estilo (Pint)
        run: vendor/bin/pint --test

      - name: Ejecutar pruebas
        run: php artisan test

  # --- Frontend: React -------------------------------------------------------
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm run test

      - name: Compilar
        run: npm run build

  # --- Seguridad de dependencias --------------------------------------------
  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_mysql, pdo_sqlite, bcmath, ctype, json, openssl, intl, zip
          coverage: none

      - name: Instalar dependencias backend
        working-directory: ./backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Auditar Composer
        working-directory: ./backend
        run: composer audit --format=summary

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: ./frontend
        run: npm ci

      - name: Auditar npm (producción)
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high
